# Sidebar navigation.
#
# The theme renders everything in `menus.main`, in weight order, between the
# fixed Home item and the contact icons. The four upstream tabs are declared by
# the site, not by the theme: a theme cannot know which pages a site has, and
# inventing menu entries would produce links to pages that may not exist.
#
# `pageRef` is Hugo's idiom for internal destinations (the documentation
# recommends it over `url`). `params.icon` is a Font Awesome class, as upstream.
#
# Example — uncomment in your site's `hugo.toml`, not here:
#
# [menus]
#   [[menus.main]]
#     name = "Categories"
#     pageRef = "/categories/"
#     weight = 1
#     [menus.main.params]
#       icon = "fas fa-stream"
#   [[menus.main]]
#     name = "Tags"
#     pageRef = "/tags/"
#     weight = 2
#     [menus.main.params]
#       icon = "fas fa-tags"
#   [[menus.main]]
#     name = "Archives"
#     pageRef = "/archives/"
#     weight = 3
#     [menus.main.params]
#       icon = "fas fa-archive"
#   [[menus.main]]
#     name = "About"
#     pageRef = "/about/"
#     weight = 4
#     [menus.main.params]
#       icon = "fas fa-info-circle"
