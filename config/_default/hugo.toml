# Theme defaults. Consumers override them; see docs/CONFIG.md.
#
# Hugo merges configuration per category. `params` is deep, so everything in
# params.toml can be overridden key by key. `markup`, `outputs`, `module`,
# `languages`, `permalinks` and `menus` are REPLACED, not merged (D-07):
# docs/CONFIG.md lists the ones a site must declare itself.

baseURL = "https://example.com/"
title = ""
defaultContentLanguage = "en"
locale = "en"
timeZone = "UTC"

# `.Lastmod` from git history is opt-in: upstream only uses it when a post has
# more than one commit (Q5, F1). With it on, `.Lastmod` becomes the commit date.
enableGitInfo = false

# `enableRobotsTXT` is NOT read from a theme configuration (measured on
# 0.168), so the site must set it; `layouts/robots.txt` reproduces the upstream
# asset once it does. See docs/CONFIG.md.

[pagination]
  pagerSize = 10
  # Jekyll has no `/page1/` alias; Hugo generates one unless this is off.
  disableAliases = true
  # D-13: Jekyll emits /page2/, Hugo emits /page/2/. The `path` option mangles
  # the URL in 0.168, so the default shape is kept.
  

[taxonomies]
  category = "categories"
  tag = "tags"

# Home outputs. `outputs` does not merge (D-07), so a site must list them too.
[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[mediaTypes."application/manifest+json"]
  suffixes = ["webmanifest"]

[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  # Upstream publishes it as an asset at this path; the search loader fetches
  # exactly this URL.
  path = "assets/js/data"
  isPlainText = true
  notAlternative = true

# Upstream serves a hand-written Atom feed at /feed.xml, a generated
# `swconf.js` at /assets/js/data/swconf.js and a Liquid-rendered
# `site.webmanifest`. All three are output formats here.
[outputFormats.feed]
  mediaType = "application/atom+xml"
  baseName = "feed"
  isPlainText = true
  notAlternative = true

[outputFormats.swconf]
  mediaType = "text/javascript"
  baseName = "swconf"
  path = "assets/js/data"
  isPlainText = true
  notAlternative = true

[outputFormats.manifest]
  mediaType = "application/manifest+json"
  baseName = "site"
  path = "assets/img/favicons"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "feed", "search", "swconf", "manifest"]
  # Upstream has no per-section or per-taxonomy feeds: only /feed.xml.
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
  page = ["HTML"]

[css.sass]
  transpiler = "dartsass"
  outputStyle = "compressed"
