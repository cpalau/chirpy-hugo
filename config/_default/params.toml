# All theme parameters and their defaults.
#
# Hugo deep-merges `params`, so a consumer overrides only what it needs and a
# site with an empty `params` table still builds (R9). Every key below is
# documented in docs/CONFIG.md.

tagline = ""
# Optional longer title for the home page (browser tab and og:title).
home_title = ""
description = ""

# Footer tooltip. Hugo has no notion of the theme's own version at render time.
# The upstream Chirpy version this port reproduces (docs and release checks).
# The footer shows this theme's own version, from `data/theme.yaml`.
theme_version = "7.6.0"

# Identity and media
avatar = ""
cdn = ""
social_preview_image = ""

# `light`, `dark` or empty (follow the system preference, keep the toggle).
theme_mode = ""

# `alt_lang` overrides the <html lang> when it differs from the UI language.
alt_lang = ""

# Global table-of-contents switch; each post can override it.
toc = true

github_username = ""
twitter_username = ""

# jekyll-seo-tag: publisher logo (JSON-LD) and the author used when a page
# does not define one.
logo = ""
author = ""
# Default twitter card. Empty means `summary_large_image` when the page has an
# image and `summary` otherwise; a page can override it with `twitter.card`.
twitter_card = ""
# jekyll-seo-tag legacy verification, used only when `webmaster_verifications`
# has no value.
google_site_verification = ""

[facebook]
  admins = ""
  publisher = ""
  app_id = ""

# Beyond-upstream SEO. Everything here is off by default so the rendered HTML
# stays byte-identical to the Jekyll original; enable a key to opt in.
[seo]
  # Add `noindex` to posts marked `hidden: true` (upstream only hides them from
  # the listings, search engines still index them).
  noindex_hidden = false
  # <link rel="alternate" type="application/atom+xml"> in the head.
  feed_discovery = false
  # BreadcrumbList structured data built from the page hierarchy.
  breadcrumbs = false
  # Hard cap for the meta description in characters (0 = upstream: 100 words).
  description_max_chars = 0
  # Use `social_preview_image` as the JSON-LD image when a page has none.
  image_fallback = false
  # article:section, article:tag and article:author.
  article_meta = false
  # og:image:type, and width/height read from the image asset when available.
  image_metadata = false
  # Warn when the sitemap grows past this many URLs (50,000 is the protocol
  # limit). The warning tells the owner which configuration splits it.
  sitemap_limit = 50000
  # Google Discover requires `max-image-preview:large` for large thumbnails.
  # Empty keeps upstream's robots meta; accepted values: large, standard, none.
  max_image_preview = ""
  # Add the post cover to the sitemap with the image extension.
  image_sitemap = false
  # JSON-LD image as a valid schema.org `ImageObject` (upstream emits
  # `imageObject` with `alt` and `lqip`, which are not schema.org properties).
  image_object = false
  # `noindex` on the 404 page.
  noindex_404 = false
  # Meta description of a term page without its own `description`. `{term}`
  # is the displayed term. Empty keeps upstream (the site description).
  term_description = ""
  # <title>, og:title and JSON-LD headline of a term page, e.g.
  # "Posts about {term}". The H1 is unchanged. Empty keeps upstream.
  term_title = ""

# Beyond-upstream accessibility. Off by default for byte parity.
[a11y]
  # Remove `user-scalable=no` from the viewport so pinch-zoom works (D-24).
  allow_zoom = false
  # Name the previous/next post links "Previous: <title>" so the accessible
  # name contains the visible title (WCAG 2.5.3). Upstream: only "Previous".
  post_nav_titles = false
  # Give the icon-only TOC button and the heading anchors an accessible name
  # (WCAG 2.4.4 / 4.1.2, axe `button-name` and `link-name`). Upstream: none.
  control_names = false

# Beyond-upstream performance. Off by default for pixel parity (G5).
[performance]
  # `content-visibility:auto` for article blocks below the fold: faster first
  # paint on long posts, but text antialiasing and image heights no longer
  # match upstream pixel for pixel.
  content_visibility = false

# Beyond-upstream search.
[search]
  # Cap each search.json entry at this many characters (0 = upstream: full
  # text). Keeps the index small on large archives.
  content_chars = 0

# Site-owned footer line. `:author` is `social.name` (linked to the first
# social link), `:year` is the current year. Empty keeps the upstream
# "© year author. Some rights reserved." line.
[footer]
  copyright = ""

[social]
  name = ""
  email = ""
  fediverse_handle = ""
  links = []

[webmaster_verifications]
  google = ""
  bing = ""
  alexa = ""
  yandex = ""
  baidu = ""
  facebook = ""

[analytics.google]
  id = ""

[analytics.goatcounter]
  id = ""

[analytics.umami]
  id = ""
  domain = ""

[analytics.matomo]
  id = ""
  domain = ""

[analytics.cloudflare]
  id = ""

[analytics.fathom]
  id = ""

[pageviews]
  provider = ""

[comments]
  provider = ""

[comments.disqus]
  shortname = ""

[comments.utterances]
  repo = ""
  issue_term = ""

[comments.giscus]
  repo = ""
  repo_id = ""
  category = ""
  category_id = ""
  mapping = "pathname"
  strict = "0"
  input_position = "bottom"
  lang = ""
  reactions_enabled = "1"

[edit_post]
  enabled = false
  url = ""
  static_url = false

[assets]
  # Day.js locale file, with `:LOCALE` replaced by the language code, e.g.
  # "/assets/js/dayjs/locale/:LOCALE.js" served from the site's static/.
  # Empty keeps upstream (self-host ships only `en.js`, so dates are English).
  dayjs_locale = ""

[assets.self_host]
  enabled = true
  env = ""

[pwa]
  enabled = true

[pwa.cache]
  enabled = true
  deny_paths = []
