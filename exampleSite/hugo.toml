# Demo site for `chirpy-hugo`.
#
# Run it with:
#
#   hugo server --themesDir ../.. --theme chirpy-hugo
#
# It is a *consumer*: only what a real site would declare lives here. The theme
# ships the parameters and the defaults; this file declares the categories Hugo
# does not merge (D-07) and the content of the demo.
#
# Nothing in this file is personal: `example.com`, neutral author, no analytics.

baseURL = "https://example.com/"
title = "Chirpy"
locale = "en"
timeZone = "UTC"

# Jekyll publishes /robots.txt (theme asset); Hugo only does it when the
# project enables it, because the key is read before the theme is merged.
enableRobotsTXT = true

theme = "chirpy-hugo"

enableGitInfo = false

[pagination]
  disableAliases = true
  pagerSize = 5

[permalinks]
  posts = "/posts/:contentbasename/"

[taxonomies]
  category = "categories"
  tag = "tags"

# `outputs` and `outputFormats` do not merge from the theme: the project
# replaces the section, so the demo lists them (D-07).
[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[mediaTypes."application/manifest+json"]
  suffixes = ["webmanifest"]

[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  # Upstream publishes it as an asset at this path; the search loader fetches
  # exactly this URL.
  path = "assets/js/data"
  isPlainText = true
  notAlternative = true

# Upstream serves a hand-written Atom feed at /feed.xml, a generated
# `swconf.js` at /assets/js/data/swconf.js and a Liquid-rendered
# `site.webmanifest`. All three are output formats here.
[outputFormats.feed]
  mediaType = "application/atom+xml"
  baseName = "feed"
  isPlainText = true
  notAlternative = true

[outputFormats.swconf]
  mediaType = "text/javascript"
  baseName = "swconf"
  path = "assets/js/data"
  isPlainText = true
  notAlternative = true

[outputFormats.manifest]
  mediaType = "application/manifest+json"
  baseName = "site"
  path = "assets/img/favicons"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "feed", "search", "swconf", "manifest"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
  page = ["HTML"]

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$']]
  inline = [['$', '$']]

[markup.highlight]
  noClasses = false

[[cascade]]
  [cascade.params]
    toc = true
    comments = true
  [cascade.target]
    path = "/posts/**"

[menus]
  [[menus.main]]
    name = "Categories"
    pageRef = "/categories/"
    weight = 1
    [menus.main.params]
      icon = "fas fa-stream"
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags/"
    weight = 2
    [menus.main.params]
      icon = "fas fa-tags"
  [[menus.main]]
    name = "Archives"
    pageRef = "/archives/"
    weight = 3
    [menus.main.params]
      icon = "fas fa-archive"
  [[menus.main]]
    name = "About"
    pageRef = "/about/"
    weight = 4
    [menus.main.params]
      icon = "fas fa-info-circle"

[params]
  # The demo mirrors the upstream Chirpy demo (title, tagline, identity).
  description = "A minimal, responsive and feature-rich Jekyll theme for technical writing. Ported to Hugo with verified pixel parity."
  tagline = "A text-focused Jekyll theme"
  theme_mode = ""

  github_username = "cpalau"
  twitter_username = "cristian_palau"

  avatar = "/commons/avatar.jpg"

  [params.social]
    name = "Cristian Palau"
    email = "cp@cristianpalau.com"
    links = ["https://github.com/cpalau/chirpy-hugo", "https://x.com/cristian_palau"]

  # The upstream demo ships giscus. It points at this repository's Discussions
  # (the demo's own threads must not collect comments meant for the port).
  [params.comments]
    provider = "giscus"

  [params.comments.giscus]
    repo = "cpalau/chirpy-hugo"
    repo_id = "R_kgDOVb9aiQ"
    category = "Announcements"
    category_id = "DIC_kwDOVb9aic4DJ-5z"
    mapping = "pathname"
    strict = "0"
    input_position = "top"
    lang = "en"
    reactions_enabled = "1"
