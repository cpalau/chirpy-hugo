# Port contract: upstream `jekyll-theme-chirpy` → `chirpy-hugo`.
#
# This file is the single source of truth for:
#   1. the pinned upstream release (tag, commit, gem version),
#   2. what happens to every upstream file (copy / transform / manual / retired),
#   3. which Hugo template each upstream template becomes.
#
# `scripts/fetch-upstream.mjs --check` enforces it:
#   - every file of the pinned upstream tree is covered here or under `ignored:`;
#   - every `copy`/`transform` file matches the sha256 recorded in
#     `tests/contract/upstream-hashes.json`;
#   - the pin here and the pin in the manifest are identical.
#
# Modes:
#   copy       upstream bytes are kept verbatim (sha256 verified)
#   transform  generated from upstream by a script (sha256 of the source verified)
#   manual     reimplemented by hand for Hugo; divergence measured by G4/G5
#   retired    absorbed by a Hugo mechanism; no counterpart file
#   new        no upstream counterpart; required by Hugo or by a divergence
#
# Paths are relative to the upstream repository root. Directory keys end in `/`.

upstream:
  repo: cotes2020/jekyll-theme-chirpy
  tag: v7.6.0
  sha: 152093879e6319dac342454d8df75a3c3572315f
  gem: jekyll-theme-chirpy
  gem_version: 7.6.0
  # The published gem is not just the tag plus packaging: it also ships the
  # build artifacts that upstream git-ignores (`_sass/vendors/`,
  # `assets/js/dist/`). See docs/AUDIT.md G-23 and docs/COMPATIBILITY.md D-10.
  artifact_sources:
    "_sass/vendors/_bootstrap.scss": gem
    "assets/js/dist/": gem

# ---------------------------------------------------------------------------
# Layouts (10)
# ---------------------------------------------------------------------------
files:
  "_layouts/default.html":
    target: layouts/baseof.html
    mode: manual
    note: document shell; panel/tail/script includes become explicit blocks
  "_layouts/home.html":
    target: layouts/home.html
    mode: manual
    note: pinned-first pagination algorithm, G-10
  "_layouts/post.html":
    target: layouts/page.html
    mode: manual
    note: post kind; panel/tail composition inlined
  "_layouts/page.html":
    target: layouts/page.html
    mode: manual
    note: plain page kind; tab titles localized
  "_layouts/archives.html":
    target: layouts/archives.html
    mode: manual
    note: content page with `layout: archives`; upstream has no section listing
  "_layouts/categories.html":
    target: layouts/taxonomy.html
    mode: manual
    note: taxonomy index for `categories` (replaces the _tabs placeholder)
  "_layouts/category.html":
    target: layouts/term.html
    mode: manual
    note: term page for `categories`
  "_layouts/tags.html":
    target: layouts/taxonomy.html
    mode: manual
    note: taxonomy index for `tags` (replaces the _tabs placeholder)
  "_layouts/tag.html":
    target: layouts/term.html
    mode: manual
    note: term page for `tags`
  "_layouts/compress.html":
    target: null
    mode: retired
    reason: jekyll-compress-html v3.2.0 Liquid layout; replaced by Hugo minify (D-05)

