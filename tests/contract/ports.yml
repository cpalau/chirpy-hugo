# ---------------------------------------------------------------------------
# Assets
# ---------------------------------------------------------------------------
  "_sass/":
    target: assets/scss/
    mode: copy
  "_javascript/":
    target: assets/js/
    mode: copy
    note: merges with assets/js/dist/ and assets/js/data/; no filename clashes
  "_sass/vendors/_bootstrap.scss":
    target: assets/scss/vendors/_bootstrap.scss
    mode: copy
    source: gem
    note: generated upstream by purgecss; shipped by the published gem (D-10)
  "assets/js/dist/":
    target: assets/js/dist/
    mode: copy
    source: gem
    note: 9 rollup bundles; shipped by the published gem (D-10)
  "assets/img/favicons/":
    target: static/assets/img/favicons/
    mode: copy
  "assets/js/data/mathjax.js":
    target: assets/js/data/mathjax.js
    mode: copy
    note: >
      The source is copied verbatim (hash-verified), but it is a Jekyll asset:
      it carries front matter and Liquid comments. `scripts/build-js.mjs`
      publishes the rendered file to `static/assets/js/data/mathjax.js`;
      without that MathJax never receives its delimiters.
  "assets/js/data/search.json":
    target: layouts/index.json
    mode: manual
    note: becomes a JSON output format for the home page (F6)
  "assets/js/data/swconf.js":
    target: layouts/swconf.js
    mode: manual
    note: becomes a JS output format with the cache list (F6)
  "assets/css/jekyll-theme-chirpy.scss":
    target: null
    mode: manual
    note: >
      Contains Liquid (`@use ... with ($theme: ...)`), so it cannot be copied or
      hashed. The equivalent is generated at build time in
      layouts/_partials/head.html with resources.FromString + toCSS (G-36).
  "assets/feed.xml":
    target: layouts/rss.xml
    mode: manual
    note: hand-written Atom, 5 posts, 400-char summary (G-07)
  "assets/robots.txt":
    target: layouts/robots.txt
    mode: manual
  "assets/404.html":
    target: layouts/404.html
    mode: manual

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
  "_data/locales/":
    target: i18n/
    mode: transform
    note: >
      Generated by scripts/i18n.mjs: 33 locales normalised against en.yml, so
      every locale has the same key tree and a missing translation falls back
      to the English value instead of an empty string (Gate 7).
      Two filenames use U+2011 (dv‑MV, ps‑AF, G-25); the language key must match
      the filename exactly. Aliasing them to ASCII is an F1 decision.
  # Hugo derives a language tag from the i18n filename and rejects U+2011, so the
  # two locales that upstream names with a non-breaking hyphen are renamed (G-25).
  "_data/locales/dv‑MV.yml":
    target: i18n/dv-MV.yml
    mode: transform
    note: U+2011 -> ASCII hyphen; content is unchanged
  "_data/locales/ps‑AF.yml":
    target: i18n/ps-AF.yml
    mode: transform
    note: U+2011 -> ASCII hyphen; content is unchanged
  "_data/authors.yml":
    target: starter/data/authors.yml
    mode: manual
    note: >
      same shape, neutral values: the upstream file names a real person, which
      R9 forbids in this repository
  "_data/contact.yml":
    target: starter/data/contact.yml
    mode: copy
    note: site data, not theme data (the gem does not ship it either)
  "_data/media.yml":
    target: starter/data/media.yml
    mode: copy
    note: site data, not theme data (the gem does not ship it either)
  "_data/share.yml":
    target: starter/data/share.yml
    mode: copy
    note: site data, not theme data (the gem does not ship it either)
  "_data/origin/":
    target: data/origin/
    mode: copy

# ---------------------------------------------------------------------------
# Plugins and site configuration
# ---------------------------------------------------------------------------
  "_plugins/posts-lastmod-hook.rb":
    target: null
    mode: retired
    reason: replaced by Hugo git info (enableGitInfo); Q5
  "_config.yml":
    target: config/_default/
    mode: manual
    note: split into hugo.toml, params.toml, markup.toml, menus.toml, module.toml, languages.toml
  "index.html":
    target: null
    mode: retired
    reason: home page marker; Hugo derives the home page from the page kind (G-37)
  "package.json":
    target: package.json
    mode: manual
    note: rollup/sass/purgecss/eslint toolchain; purgecss globs adapted to layouts/
  "purgecss.js":
    target: scripts/purgecss.mjs
    mode: manual
    note: only used to prove the shipped _bootstrap.scss; not part of the asset pipeline
  "rollup.config.js":
    target: rollup.config.mjs
    mode: manual
    note: only used to prove the shipped bundles; consumers get them from the gem
  "eslint.config.js":
    target: eslint.config.mjs
    mode: manual
  ".stylelintrc.json":
    target: .stylelintrc.json
    mode: manual
    note: globs retargeted from _sass/ to assets/scss/
  "jekyll-theme-chirpy.gemspec":
    target: theme.toml
    mode: new
    note: theme metadata, different format

# ---------------------------------------------------------------------------
# Hugo-only files (no upstream counterpart)
# ---------------------------------------------------------------------------
new_files:
  "layouts/section.html":
    mode: new
    reason: Hugo generates section listings; upstream has no such URL (parity handled in F3)
  "layouts/_markup/render-codeblock.html":
    mode: new
    replaces: "_includes/refactor-content.html (R2, R6)"
  "layouts/_markup/render-image.html":
    mode: new
    replaces: "_includes/refactor-content.html (R4, R5)"
  "layouts/_markup/render-heading.html":
    mode: new
    replaces: "_includes/refactor-content.html (R7)"
  "layouts/_partials/content.html":
    mode: new
    replaces: "_includes/refactor-content.html (R1, R3, G-39); there is no table render hook API, so the wrapper is applied here"
  "layouts/_markup/render-link.html":
    mode: new
    reason: internal link resolution and external-link attributes
  "layouts/_shortcodes/prompt.html":
    mode: new
    replaces: kramdown prompt IAL (D-01)
  "layouts/_shortcodes/filepath.html":
    mode: new
    replaces: kramdown `{: .filepath }` (D-01)
  "layouts/_shortcodes/img.html":
    mode: new
    replaces: kramdown image IAL (D-01); Goldmark does not support inline attributes on images
  "layouts/_partials/task-list.html":
    mode: new
    replaces: "_includes/refactor-content.html (R3)"

