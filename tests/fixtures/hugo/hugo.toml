# Hugo counterpart of `tests/oracle/_config.yml`.
#
# Every value here has a counterpart in the oracle. When the two disagree, the
# diff is a fixture bug, not a theme bug: the Jekyll side is the reference.
#
# The theme itself is not configured here on purpose — this site is the
# *consumer*, so it only declares what a real user would.

baseURL = "http://127.0.0.1:4001/"
title = "Chirpy Fixtures"

theme = "chirpy-hugo"

defaultContentLanguage = "en"
# `languageCode` was deprecated in Hugo 0.158; `locale` replaces it.
locale = "en"
timeZone = "UTC"

# Jekyll publishes /robots.txt (theme asset); Hugo only does it when the
# project enables it, because the key is read before the theme is merged.
enableRobotsTXT = true

# Off by default: with it on, Hugo derives `.Lastmod` from the commit date, which
# upstream only does when a post has more than one commit (Q5, F1).
enableGitInfo = false

# Same URL shape as Jekyll's `permalink: /posts/:title/`.
[pagination]
  disableAliases = true
  pagerSize = 3
  # Upstream (Jekyll) uses /page2/; Hugo's path option is broken in 0.168, so the
  # default /page/2/ is used and the difference is recorded as D-13.

[permalinks]
  posts = "/posts/:contentbasename/"

[taxonomies]
  category = "categories"
  tag = "tags"

# `search.json` (F6). The output format itself is declared by the theme, but
# `outputs` does not merge, so the consumer has to list it.
[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[mediaTypes."application/manifest+json"]
  suffixes = ["webmanifest"]

[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  # Upstream publishes it as an asset at this path; the search loader fetches
  # exactly this URL.
  path = "assets/js/data"
  isPlainText = true
  notAlternative = true

# Upstream serves a hand-written Atom feed at /feed.xml, a generated
# `swconf.js` at /assets/js/data/swconf.js and a Liquid-rendered
# `site.webmanifest`. All three are output formats here.
[outputFormats.feed]
  mediaType = "application/atom+xml"
  baseName = "feed"
  isPlainText = true
  notAlternative = true

[outputFormats.swconf]
  mediaType = "text/javascript"
  baseName = "swconf"
  path = "assets/js/data"
  isPlainText = true
  notAlternative = true

[outputFormats.manifest]
  mediaType = "application/manifest+json"
  baseName = "site"
  path = "assets/img/favicons"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "feed", "search", "swconf", "manifest"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
  page = ["HTML"]

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser.attribute]
  block = true

# Math must reach MathJax untouched (`\,` is a LaTeX thin space).
[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$']]
  inline = [['$', '$']]

[markup.highlight]
  noClasses = false

# Jekyll's `defaults` for posts: layout, comments and toc.
[[cascade]]
  [cascade.params]
    toc = true
    comments = true
  [cascade.target]
    path = "/posts/**"

[params]
  tagline = "Parity fixtures for chirpy-hugo"
  description = "Neutral fixtures used to compare the Jekyll original with the Hugo port."
  theme_version = "7.6.0"

  github_username = "example"
  twitter_username = "example"

  # Empty means "follow the system preference"; keeps the theme toggle.
  theme_mode = ""

  cdn = ""
  avatar = "/assets/img/avatar.png"
  social_preview_image = "/assets/img/social-preview.png"

  toc = true

  [params.social]
    name = "Example Author"
    email = "author@example.com"
    fediverse_handle = "@author@example.com"
    links = ["https://example.com/author"]

  [params.webmaster_verifications]
    google = "example-google"
    bing = "example-bing"
    alexa = "example-alexa"
    yandex = "example-yandex"
    baidu = "example-baidu"
    facebook = "example-facebook"

  [params.analytics.google]
    id = "G-EXAMPLE"

  [params.analytics.goatcounter]
    id = "example"

  [params.analytics.umami]
    id = ""
    domain = ""

  [params.analytics.matomo]
    id = ""
    domain = ""

  [params.analytics.cloudflare]
    id = ""

  [params.analytics.fathom]
    id = ""

  [params.pageviews]
    provider = "goatcounter"

  [params.edit_post]
    enabled = true
    url = "https://example.com/edit"
    # D-12: static URL so `page.path` never leaks into the comparison.
    static_url = true

  [params.comments]
    provider = "giscus"

  [params.comments.disqus]
    shortname = ""

  [params.comments.utterances]
    repo = ""
    issue_term = ""

  [params.comments.giscus]
    repo = "example/example"
    repo_id = "R_kgDOexample"
    category = "Comments"
    category_id = "DIC_kwDOexample"
    mapping = "pathname"
    strict = "0"
    input_position = "top"
    lang = "en"
    reactions_enabled = "1"

  [params.assets.self_host]
    enabled = true

  [params.pwa]
    enabled = true

  # Off on purpose: `swconf.js` embeds the build time in `cacheName` (G-21).
  [params.pwa.cache]
    enabled = false
    deny_paths = ["/example"]

# The four tabs, in upstream order (upstream: the `tabs` collection, sorted by
# `order`). `categories` and `tags` point at the taxonomy indexes: upstream's
# `_tabs` placeholders have no Hugo counterpart and must not be created, or they
# would collide with `/categories/` and `/tags/`.

[[menus.main]]
  name = "Categories"
  url = "/categories/"
  weight = 1
  [menus.main.params]
    icon = "fas fa-stream"

[[menus.main]]
  name = "Tags"
  url = "/tags/"
  weight = 2
  [menus.main.params]
    icon = "fas fa-tags"

[[menus.main]]
  name = "Archives"
  url = "/archives/"
  weight = 3
  [menus.main.params]
    icon = "fas fa-archive"

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 4
  [menus.main.params]
    icon = "fas fa-info-circle"
