# Minimum configuration for a site that uses `chirpy-hugo`.
#
# Copy this file next to your `content/` directory and add the theme. The theme
# ships every parameter default, so `[params]` can stay empty (R9); the sections
# below cannot be inherited from the theme and must be declared by the site
# (D-07).

baseURL = "https://example.com/"
title = "My Site"
locale = "en"
timeZone = "UTC"

# Jekyll publishes /robots.txt (theme asset); Hugo only does it when the
# project enables it, because the key is read before the theme is merged.
enableRobotsTXT = true

theme = "chirpy-hugo"

[pagination]
  disableAliases = true
  pagerSize = 10

[permalinks]
  posts = "/posts/:contentbasename/"

[taxonomies]
  category = "categories"
  tag = "tags"

# Mandatory: `outputs` and `outputFormats` do not merge from the theme.
[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[mediaTypes."application/manifest+json"]
  suffixes = ["webmanifest"]

[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  # Upstream publishes it as an asset at this path; the search loader fetches
  # exactly this URL.
  path = "assets/js/data"
  isPlainText = true
  notAlternative = true

# Upstream serves a hand-written Atom feed at /feed.xml, a generated
# `swconf.js` at /assets/js/data/swconf.js and a Liquid-rendered
# `site.webmanifest`. All three are output formats here.
[outputFormats.feed]
  mediaType = "application/atom+xml"
  baseName = "feed"
  isPlainText = true
  notAlternative = true

[outputFormats.swconf]
  mediaType = "text/javascript"
  baseName = "swconf"
  path = "assets/js/data"
  isPlainText = true
  notAlternative = true

[outputFormats.manifest]
  mediaType = "application/manifest+json"
  baseName = "site"
  path = "assets/img/favicons"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "feed", "search", "swconf", "manifest"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
  page = ["HTML"]

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$']]
  inline = [['$', '$']]

[markup.highlight]
  noClasses = false

[[cascade]]
  [cascade.params]
    toc = true
    comments = true
  [cascade.target]
    path = "/posts/**"

[menus]
  [[menus.main]]
    name = "Categories"
    pageRef = "/categories/"
    weight = 1
    [menus.main.params]
      icon = "fas fa-stream"
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags/"
    weight = 2
    [menus.main.params]
      icon = "fas fa-tags"
  [[menus.main]]
    name = "Archives"
    pageRef = "/archives/"
    weight = 3
    [menus.main.params]
      icon = "fas fa-archive"
  [[menus.main]]
    name = "About"
    pageRef = "/about/"
    weight = 4
    [menus.main.params]
      icon = "fas fa-info-circle"

# Everything below is optional: the theme has a default for each key.
[params]
  description = "A site built with chirpy-hugo."
  tagline = ""
  # Neutral social card for Open Graph and Twitter; replace it with your own.
  social_preview_image = "/img/social-preview.png"

  [params.social]
    name = "Your Name"
    email = ""
    links = []
