# Minimum configuration for a site that uses `chirpy-hugo`.
#
# Copy this file next to your `content/` directory and add the theme. The theme
# ships every parameter default, so `[params]` can stay empty (R9); the sections
# below cannot be inherited from the theme and must be declared by the site
# (D-07).

baseURL = "https://example.com/"
title = "My Site"
locale = "en"
timeZone = "UTC"

theme = "chirpy-hugo"

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/posts/:contentbasename/"

[taxonomies]
  category = "categories"
  tag = "tags"

# Mandatory: `outputs` and `outputFormats` do not merge from the theme.
[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "search"]

# Mandatory: Goldmark settings do not merge from the theme.
[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$']]
  inline = [['$', '$']]

[markup.highlight]
  noClasses = false

[[cascade]]
  [cascade.params]
    toc = true
    comments = true
  [cascade.target]
    path = "/posts/**"

[menus]
  [[menus.main]]
    name = "Categories"
    pageRef = "/categories/"
    weight = 1
    [menus.main.params]
      icon = "fas fa-stream"
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags/"
    weight = 2
    [menus.main.params]
      icon = "fas fa-tags"
  [[menus.main]]
    name = "Archives"
    pageRef = "/archives/"
    weight = 3
    [menus.main.params]
      icon = "fas fa-archive"
  [[menus.main]]
    name = "About"
    pageRef = "/about/"
    weight = 4
    [menus.main.params]
      icon = "fas fa-info-circle"

# Everything below is optional: the theme has a default for each key.
[params]
  description = "A site built with chirpy-hugo."
  tagline = ""

  [params.social]
    name = "Your Name"
    email = ""
    links = []
