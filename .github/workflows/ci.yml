name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.168.0
  NODE_VERSION: 24

jobs:
  commitlint:
    # Runs on both events. A PR has base/head; a push has `before`/`sha`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint the commit range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            from="$BASE"
            to="$HEAD"
          else
            from="$BEFORE"
            to="$SHA"
            # A new branch or a force push sends a zero/hidden `before`; fall
            # back to the root commit rather than linting nothing.
            if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
              from=$(git rev-list --max-parents=0 "$to" | tail -1)
            fi
          fi
          echo "commitlint: $from..$to"
          npx commitlint --from "$from" --to "$to"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Cache the pinned upstream tree
        uses: actions/cache@v6
        with:
          path: .out/upstream
          key: upstream-${{ hashFiles('tests/contract/ports.yml') }}

      - name: Fetch and verify the upstream pin
        run: |
          node scripts/fetch-upstream.mjs --fetch
          node scripts/fetch-upstream.mjs --check
          node scripts/extract-params.mjs --check

      - name: Verify the generated translation catalogue
        run: npm run test:i18n

      - name: Verify the vendored libraries
        run: npm run test:vendor

      - name: Configuration contract
        run: npm run test:config

      - name: Release consistency
        run: npm run test:release

      - name: Deployment shape (subdirectory + minify) and emitted URLs
        run: |
          hugo -s exampleSite --themesDir "$GITHUB_WORKSPACE/.." --theme chirpy-hugo \
            --baseURL "https://example.com/chirpy-hugo/" --minify --panicOnWarning \
            -d "$RUNNER_TEMP/deploy"
          node tests/adoption/check.mjs --deploy-only

      - name: Provider and front-matter matrix
        run: node tests/adoption/check.mjs --features-only

      - name: Build the demo site (warnings are errors)
        run: |
          hugo -s exampleSite --themesDir "$GITHUB_WORKSPACE/.." --theme chirpy-hugo \
            --panicOnWarning --gc --minify -d "$RUNNER_TEMP/example"

      - name: Build the empty site (adoption smoke test)
        run: |
          mkdir -p "$RUNNER_TEMP/empty/content"
          cp starter/hugo.toml "$RUNNER_TEMP/empty/hugo.toml"
          hugo -s "$RUNNER_TEMP/empty" --themesDir "$GITHUB_WORKSPACE/.." --theme chirpy-hugo \
            --panicOnWarning --gc --minify

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx --yes playwright@1.64.1 install --with-deps chromium
      - name: Build the fixture site
        run: |
          hugo -s tests/fixtures/hugo --themesDir "$GITHUB_WORKSPACE/.." --theme chirpy-hugo \
            -d "$GITHUB_WORKSPACE/.out/hugo"
      - name: UI matrix (desktop, tablet, mobile)
        run: node tests/ui/check.mjs .out/hugo --fast

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: tests/oracle
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Q1-Q4 contract tests (they compare against Jekyll's filters)
        run: npm run test:qa

      - name: Build the Jekyll oracle
        run: bash tests/oracle/build.sh

      - name: Build the same content with Hugo
        run: |
          hugo -s tests/fixtures/hugo --themesDir "$GITHUB_WORKSPACE/.." --theme chirpy-hugo \
            -d "$GITHUB_WORKSPACE/.out/hugo"

      - name: Gate 1 - build integrity
        run: npm run test:build

      - name: Gate 2 - HTML validity, links and anchors
        run: npm run test:html

      - name: Gate 3 - DOM contract
        run: npm run test:contract

      - name: Gate 4 - HTML parity
        run: npm run test:parity

      - name: Non-HTML outputs (feed, sitemap, search, swconf, manifest)
        run: npm run test:outputs
