{{- /* Ports refactor-content's R7: anchors on h2-h5 only (G-04). */ -}}
{{- if in (slice 2 3 4 5) .Level -}}
<h{{ .Level }} id="{{ .Anchor }}"><span class="me-2">{{ .Text | safeHTML }}</span><a {{ printf `href="#%s"` .Anchor | safeHTMLAttr }} class="anchor text-muted"><i class="fas fa-hashtag"></i></a></h{{ .Level }}>
{{- else -}}
<h{{ .Level }} id="{{ .Anchor }}">{{ .Text | safeHTML }}</h{{ .Level }}>
{{- end -}}
