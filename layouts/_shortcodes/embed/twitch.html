{{- $parent := (index (split site.BaseURL "://") 1) | strings.TrimSuffix "/" -}}
{{- $src := printf "https://player.twitch.tv/?video=%s&parent=%s" (.Get "id") $parent -}}
<iframe
  class="embed-video twitch"
  loading="lazy"
  src="{{ $src | safeURL }}"
  frameborder="0"
  allowfullscreen="true"
  scrolling="no"
></iframe>
