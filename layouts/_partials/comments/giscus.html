{{- /* Ports _includes/comments/giscus.html. */ -}}
{{- $cfg := .Site.Params.comments.giscus -}}
{{- $lang := .Site.Params.comments.giscus.lang | default .Lang -}}
<script>
  (function () {
    const themeMap = Theme.newThemeMap('light', 'dark_dimmed');
    const initTheme = themeMap[Theme.resolvedTheme];
    let lang = '{{ $lang }}';if (lang.length > 2 && !lang.startsWith('zh')) {
      lang = lang.slice(0, 2);
    }
    let giscusAttributes = {
      src: 'https://giscus.app/client.js',
      'data-repo': '{{ $cfg.repo }}',
      'data-repo-id': '{{ $cfg.repo_id }}',
      'data-category': '{{ $cfg.category }}',
      'data-category-id': '{{ $cfg.category_id }}',
      'data-mapping': '{{ $cfg.mapping }}',
      'data-strict' : '{{ $cfg.strict }}',
      'data-reactions-enabled': '{{ $cfg.reactions_enabled }}',
      'data-emit-metadata': '0',
      'data-theme': initTheme,
      'data-input-position': '{{ $cfg.input_position }}',
      'data-lang': lang,
      'data-loading': 'lazy',
      crossorigin: 'anonymous',
      async: ''
    };
    let giscusNode = document.createElement('script');
    Object.entries(giscusAttributes).forEach(([key, value]) => giscusNode.setAttribute(key, value)
    );
    const $footer = document.querySelector('footer');
    $footer.insertAdjacentElement("beforebegin", giscusNode);
    addEventListener('message', (event) => {
      if (event.source === window && event.data && event.data.id === Theme.eventId) {
        const newTheme = themeMap[Theme.resolvedTheme];
        const message = { setConfig: { theme: newTheme } };
        const iframe = document.querySelector('.giscus-frame');
        if (!iframe) {
          return;
        }
        if (iframe.classList.contains('giscus-frame--loading')) {
          let url = new URL(iframe.src);
          url.searchParams.set('theme', newTheme);
          iframe.src = url.toString();
        }
        iframe.contentWindow.postMessage({ giscus: message }, 'https://giscus.app');
      }
    });
  })();
</script>
